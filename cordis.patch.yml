# dsh-purge-fork bundle patch
#
# 仅保留清洗功能；预设（unrestricted）随包提供，注入类补丁已移除。
# 只装 dsh-purge-fork，不外接、不 link 其它包。

- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: ""
    # 不要在这里写 personaSuffix（旧版写过 `Your working directory is {{cwd}}.`）。
    # 0.2.1-rc.2 起 agent-loop 不再注册 `cwd` 插值变量，工作目录改由
    # working-directory 上下文下发；段落里残留 `{{cwd}}` 会让整轮 renderPrompt
    # 抛 unknown prompt variable。工作目录后缀由插件运行时按真实路径补
    # （lib/identity.js cwdSuffixText）。

- id: dsh-purge-fork
  inject: [systemPrompt, tools]

- insert:
    - id: dsh-purge-fork
      name: 'dsh-purge-fork'
      inject: [systemPrompt, tools]
      config:
        enabled: true
        autoApplyOnStart: false
        autoUpdateOnStart: false
        autoRevertOnMissing: false
        injectOnce: false
        stripMnemon: true
        verbose: false
        postPrompt: ""
        postPromptOrder: 5100
        autoRetry: true
        retryMax: 3
        autoContinue: false
        continueMax: 3
        continueText: "继续"
        capabilityProtocol: true
        hooksDenyBypass: true
